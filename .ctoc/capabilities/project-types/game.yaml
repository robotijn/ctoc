# game — a game project (Unity / Unreal / Godot / Bevy). Games build to platform
# binaries; a windowed runtime cannot be driven in headless CI, so build is the honest
# last mile (build-is-last-mile), never a false "it ran".
# MARKER HONESTY: the DECISIVE markers are project.godot (Godot, a fixed filename),
# ProjectSettings (Unity, a fixed DIRECTORY, matched by existsSync), and *.uproject
# (Unreal, a project-named GLOB). As of wave 4 projectTypeFor is glob-aware (it mirrors
# detectLanguages: a ReDoS-safe, anchored readdir match via safeRegExp), so the *.uproject
# glob FIRES — it is no longer a dead marker. bevy stays in `frameworks` (informational)
# because it is a plain Cargo.toml Rust crate with no unique file of its own.
projectType: game
detectionMarkers: [project.godot, ProjectSettings, "*.uproject"]
frameworks: [unity, unreal, godot, bevy]
priority: 72
runShape: none
phases: { lint: recommended, typecheck: optional, test: recommended, security: optional, coverage: optional }
run: { strategy: build, honest: build-is-last-mile }
configScaffold: [project.godot, .gitignore]
verified: web-2026-07
