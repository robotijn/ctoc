# data-science — notebooks + pipelines. lint/test are RECOMMENDED (exploratory
# code), typecheck OPTIONAL. The honest run is executing the notebook end-to-end
# (`jupyter nbconvert --execute`), flagged honest:notebook-executes.
# DETECTION (DEF5): the marker is dvc.yaml only. papermill.yaml was removed — it is
# fabricated: papermill is a CLI with no root config-file convention (no standard
# papermill.yaml exists), so the marker could never fire. A generic Conda environment.yml
# is deliberately NOT a marker either — it appears in ml-service/general Python projects
# and would wrongly outrank the ml-service type (downgrading test:required).
projectType: data-science
detectionMarkers: [dvc.yaml]
frameworks: [jupyter, pandas, dvc, papermill]
priority: 75
runShape: none
phases: { lint: recommended, typecheck: optional, test: recommended, security: optional, coverage: optional }
run: { strategy: notebook-execute, honest: notebook-executes }
configScaffold: [requirements.txt, pyproject.toml, dvc.yaml, .gitignore]
verified: web-2026-07
