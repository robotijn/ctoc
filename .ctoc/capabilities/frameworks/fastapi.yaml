# FastAPI — Python async API framework. Injection (SQL/NoSQL in handlers), auth via
# dependency injection (OAuth2/JWT), CORS (CORSMiddleware), Pydantic input validation,
# and sensitive-settings hygiene are the concern areas. A pure backend ships NO client
# bundle, so it carries `sensitive-settings` (like django), NOT `env-exposure` — the
# client-exposed-secret check keys off `env-exposure` and must not consider a backend
# relevant. Detected by the `fastapi` requirement. Tests run under pytest (httpx/TestClient).
framework: fastapi
category: api
language: python
deps: [fastapi]
files: []
security:
  concerns: [injection, auth-dependency, cors, input-validation, sensitive-settings]
test: "pytest"
configScaffold: [.env.example]
verified: web-2026-07
