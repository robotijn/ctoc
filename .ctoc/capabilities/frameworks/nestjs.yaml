# NestJS — structured Node backend framework. Injection, auth guards, the global
# ValidationPipe (whitelist + class-validator), CORS, and sensitive-settings hygiene are
# the concern areas. A pure backend ships NO client bundle, so it carries
# `sensitive-settings` (like django), NOT `env-exposure` — the client-exposed-secret
# check keys off `env-exposure` and must not consider a backend relevant. Detected by
# @nestjs/core and nest-cli.json. Nest scaffolds jest by default (`nest build` compiles,
# `jest` runs unit specs).
framework: nestjs
category: web-backend
language: typescript
deps: [@nestjs/core]
files: [nest-cli.json]
security:
  concerns: [injection, auth-guards, validation-pipe, cors, sensitive-settings]
test: "nest build && jest"
configScaffold: [nest-cli.json, .env.example]
verified: web-2026-07
