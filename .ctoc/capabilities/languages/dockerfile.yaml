# Dockerfile capability entry — web-grounded 2026 toolchain. DELIBERATELY PARTIAL, and
# that is HONEST, not a gap. A Dockerfile has no standard formatter, no test runner, and
# no coverage; its image dependency scan (`trivy image`) is a DIFFERENT runtime target
# (a built image, not the Dockerfile source) — so format / typecheck / test / coverage /
# depsAudit are OMITTED (absent = honest N/A, never a stub). lint is hadolint (the
# standard Dockerfile linter). SECURITY is `trivy config` — Trivy scans Dockerfiles/IaC
# for misconfiguration (tfsec was folded into Trivy in 2023 and is deprecated; never
# tfsec) — with hadolint as the alternative. build is `docker build`. RUN is honestly
# build-is-last-mile: an image is BUILT, not launched — building the image is the
# CI-safe last mile, never a false "it ran", so it exposes no runnable shape.
# MARKER HONESTY (wave-2 fix): detectionMarkers is narrowed to [Dockerfile] ONLY. The
# lint/build commands hardcode the literal `Dockerfile` filename (the registry stores a
# static string and cannot compute the detected filename), so accepting `*.dockerfile`
# or `Containerfile` used to detect dockerfile and then FAIL when `hadolint Dockerfile`
# found no Dockerfile. Honest under-detection of the rare Podman-Containerfile /
# multi-dockerfile repo beats detect-then-fail; the command now always matches what was
# detected.
language: dockerfile
detectionMarkers: [Dockerfile]
extensions: [.dockerfile]
toolchain:
  lint:     { cmd: "hadolint Dockerfile", tool: hadolint, verified: web-2026-07 }
  security: { cmd: "trivy config .", tool: trivy, altCmd: "hadolint Dockerfile", verified: web-2026-07 }
  build:    { cmd: "docker build .", tool: docker, verified: web-2026-07 }
run:
  shapes: { }
  honest: build-is-last-mile
configScaffold: [.dockerignore, .hadolint.yaml]
verified: web-2026-07
