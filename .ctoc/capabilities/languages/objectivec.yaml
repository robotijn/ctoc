# Objective-C capability entry — web-grounded 2026 toolchain (OCLint + clang-format +
# xcodebuild/XCTest). Mobile run is HONEST: build+test is the CI-safe last mile — never
# a false "it ran". security is UNVERIFIED (no standard Objective-C SAST) and depsAudit
# is UNVERIFIED (CocoaPods/SwiftPM have no standard audit command).
# DETECTION (CR5-FIX F2): Objective-C is detected ONLY by its source extension (*.m). A
# bare `Podfile` (CocoaPods — used by Swift too) and `*.xcodeproj` (shared with Swift)
# were removed as markers because they do not distinguish Objective-C from Swift; `*.m`
# is the Objective-C source extension and the best available disambiguating signal.
language: objectivec
detectionMarkers: ["*.m"]
extensions: [.m, .mm, .h]
toolchain:
  lint:      { cmd: "oclint", tool: oclint, verified: web-2026-07 }
  format:    { cmd: "clang-format --dry-run --Werror", tool: clang-format, verified: web-2026-07 }
  typecheck: { cmd: "xcodebuild build", tool: xcodebuild, verified: web-2026-07 }
  test:      { cmd: "xcodebuild test", tool: xcodebuild, verified: web-2026-07 }
  coverage:  { cmd: "xcodebuild test -enableCodeCoverage YES", tool: xcodebuild, verified: web-2026-07 }
  security:  { cmd: "oclint", tool: oclint, verified: UNVERIFIED }
  depsAudit: { cmd: "pod outdated", tool: cocoapods, verified: UNVERIFIED }
  build:     { cmd: "xcodebuild", tool: xcodebuild, verified: web-2026-07 }
run:
  shapes: { mobile: "xcodebuild build" }
  honest: build-is-last-mile
configScaffold: [Podfile, .clang-format]
verified: web-2026-07
