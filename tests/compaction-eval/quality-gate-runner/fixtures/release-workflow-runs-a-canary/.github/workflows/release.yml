name: release
on:
  push:
    tags: ['v*']
jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: npm test
      - name: Publish release
        run: node scripts/publish.js
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
